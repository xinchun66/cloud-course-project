name: Build App Images and Push to SWR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/cicd-app-to-swr-cce.yml"

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_NAMESPACE: cloud-course-a

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Huawei SWR
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | docker login "${SWR_REGISTRY}" \
            -u "${{ secrets.SWR_USERNAME }}" \
            --password-stdin

      - name: Build backend image
        run: |
          docker build -t "${SWR_REGISTRY}/${SWR_NAMESPACE}/backend:${IMAGE_TAG}" ./backend

      - name: Build frontend image
        run: |
          docker build -t "${SWR_REGISTRY}/${SWR_NAMESPACE}/frontend:${IMAGE_TAG}" ./frontend

      - name: Push backend image
        run: |
          docker push "${SWR_REGISTRY}/${SWR_NAMESPACE}/backend:${IMAGE_TAG}"

      - name: Push frontend image
        run: |
          docker push "${SWR_REGISTRY}/${SWR_NAMESPACE}/frontend:${IMAGE_TAG}"

      - name: Show pushed image tags
        run: |
          echo "backend image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/backend:${IMAGE_TAG}"
          echo "frontend image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/frontend:${IMAGE_TAG}"
